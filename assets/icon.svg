  <path d="M256 90 C256 90 140 240 140 330 C140 395 192 440 256 440 C320 440 372 395 372 330 C372 240 256 90 256 90 Z" fill="url(#waterGrad)" opacity="0.95"/>
  
  <!-- Car silhouette inside water drop -->
  <path d="M190 340 L210 295 C215 285 225 280 238 280 L274 280 C287 280 297 285 302 295 L322 340 C332 342 338 348 338 358 L338 375 C338 382 332 388 325 388 L320 388 C315 388 310 384 310 378 L310 370 L202 370 L202 378 C202 384 197 388 192 388 L187 388 C180 388 174 382 174 375 L174 358 C174 348 180 342 190 340 Z" fill="#FFFFFF"/>
  <!-- Car windows -->
  <path d="M220 298 L206 332 L250 332 L250 298 Z" fill="#252736" opacity="0.85"/>
  <path d="M262 298 L262 332 L306 332 L292 298 Z" fill="#252736" opacity="0.85"/>
  <!-- Wheels/Lights -->
  <circle cx="206" cy="355" r="9" fill="#EA580C"/>
