  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#EA580C" stroke-width="6" stroke-opacity="0.25"/>

